name: cloudpulse
services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudpulse
      POSTGRES_USER: cloudpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/bootstrap.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cloudpulse -d cloudpulse"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      CLOUDPULSE_DATABASE_URL: postgresql+psycopg://cloudpulse:${POSTGRES_PASSWORD}@db:5432/cloudpulse
      CLOUDPULSE_DB_PASSWORD: ${CLOUDPULSE_DB_PASSWORD:?Run python scripts/bootstrap.py first}
      CLOUDPULSE_ADMIN_TOKEN: ${CLOUDPULSE_ADMIN_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    command: [python, -m, app.migrate]
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      CLOUDPULSE_DATABASE_URL: postgresql+psycopg://cloudpulse_runtime:${CLOUDPULSE_DB_PASSWORD}@db:5432/cloudpulse
      CLOUDPULSE_ADMIN_TOKEN: ${CLOUDPULSE_ADMIN_TOKEN:?Run python scripts/bootstrap.py first}
      CLOUDPULSE_RETENTION_DAYS: ${CLOUDPULSE_RETENTION_DAYS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health")',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 15
  retention:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      CLOUDPULSE_DATABASE_URL: postgresql+psycopg://cloudpulse_runtime:${CLOUDPULSE_DB_PASSWORD}@db:5432/cloudpulse
      CLOUDPULSE_ADMIN_TOKEN: ${CLOUDPULSE_ADMIN_TOKEN}
      CLOUDPULSE_RETENTION_DAYS: ${CLOUDPULSE_RETENTION_DAYS:-30}
    depends_on:
      backend:
        condition: service_healthy
    command: [python, -m, app.retention]
  test:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      CLOUDPULSE_DATABASE_URL: postgresql+psycopg://cloudpulse:${POSTGRES_PASSWORD}@db:5432/cloudpulse
      CLOUDPULSE_TEST_RUNTIME_DATABASE_URL: postgresql+psycopg://cloudpulse_runtime:${CLOUDPULSE_DB_PASSWORD}@db:5432/cloudpulse
      CLOUDPULSE_TEST_DATABASE_URL: postgresql+psycopg://cloudpulse:${POSTGRES_PASSWORD}@db:5432/cloudpulse
      CLOUDPULSE_ADMIN_TOKEN: ${CLOUDPULSE_ADMIN_TOKEN:?Run python scripts/bootstrap.py first}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
